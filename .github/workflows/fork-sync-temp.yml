name: fork-sync-temp

# Manual sync of the fork's `dev` branch with its upstream parent.
# NOTE: the default GITHUB_TOKEN cannot update files under .github/workflows/,
# and the upstream sync includes workflow changes, so this needs a PAT
# (classic, with `repo` + `workflow` scopes) stored as the secret SYNC_TOKEN.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-sync-temp
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward dev from upstream (merge-upstream)
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          set -e
          echo "Repository: ${{ github.repository }}"
          echo "Syncing 'dev' from upstream parent..."
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/merge-upstream" \
            -f branch=dev
          echo "----- dev after sync -----"
          gh api "repos/${{ github.repository }}/branches/dev" \
            --jq '.commit.sha + "  " + .commit.commit.message'
